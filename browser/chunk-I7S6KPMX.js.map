<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>{{ isEditMode ? "編輯" : "新增" }}使用者</h2>
  </div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="p-fluid">
    <div class="field">
      <label for="name">姓名</label>
      <input
        id="name"
        type="text"
        pInputText
        formControlName="name"
        [ngClass]="{
          'ng-invalid ng-dirty':
            userForm.get('name')?.invalid && userForm.get('name')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched"
      >
        姓名為必填欄位，且至少需要 2 個字元
      </small>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="text"
        pInputText
        formControlName="email"
        [ngClass]="{
          'ng-invalid ng-dirty':
            userForm.get('email')?.invalid && userForm.get('email')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched"
      >
        請輸入有效的 Email 地址
      </small>
    </div>

    <div class="field">
      <label for="phone">電話</label>
      <input
        id="phone"
        type="text"
        pInputText
        formControlName="phone"
        [ngClass]="{
          'ng-invalid ng-dirty':
            userForm.get('phone')?.invalid && userForm.get('phone')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="userForm.get('phone')?.invalid && userForm.get('phone')?.touched"
      >
        請輸入有效的電話號碼
      </small>
    </div>

    <div class="field">
      <label for="address">地址</label>
      <input
        id="address"
        type="text"
        pInputText
        formControlName="address"
        [ngClass]="{
          'ng-invalid ng-dirty':
            userForm.get('address')?.invalid && userForm.get('address')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="
          userForm.get('address')?.invalid && userForm.get('address')?.touched
        "
      >
        請輸入有效的地址
      </small>
    </div>

    <div
      class="field flex justify-content-start align-items-center"
      *ngIf="isEditMode"
    >
      <label class="mr-4" for="isActive">帳號狀態</label>
      <p-inputSwitch formControlName="isActive"></p-inputSwitch>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <button
        pButton
        type="button"
        label="取消"
        class="p-button-secondary"
        routerLink="/users"
      ></button>
      <button
        pButton
        type="submit"
        label="儲存"
        [loading]="loading"
        [disabled]="userForm.invalid"
      ></button>
    </div>
  </form>
</div>
