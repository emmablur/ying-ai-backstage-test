<div class="card">
  <p-confirmDialog />
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>帳戶管理</h2>
    <button
      pButton
      label="新增帳戶"
      icon="pi pi-plus"
      class="p-button-success"
      routerLink="new"
    ></button>
  </div>

  <p-table
    [value]="accounts"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="p-datatable-gridlines"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>姓名</th>
        <th>Email</th>
        <th>狀態</th>
        <th>操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-account>
      <tr>
        <td>{{ account.name }}</td>
        <td>{{ account.email }}</td>
        <td>
          @if(account.isActive){
          <p-tag severity="success" value="啟用中"></p-tag>
          }@else{
          <p-tag severity="secondary" value="已刪除"></p-tag>
          }
        </td>
        <td>
          <div class="flex gap-2">
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-rounded p-button-success"
              [routerLink]="['edit', account._id]"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger"
              (click)="confirmDelete(account)"
            ></button>
            <button
              pButton
              icon="pi pi-envelope"
              class="p-button-rounded p-button-info"
              (click)="sendTestEmail(account)"
              [disabled]="!account.isActive"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center p-4">尚無帳戶資料.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
