<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>{{ isEditMode ? "編輯" : "新增" }}帳戶</h2>
  </div>

  <form [formGroup]="accountForm" (ngSubmit)="onSubmit()" class="p-fluid">
    <div class="field">
      <label for="name">姓名</label>
      <input
        id="name"
        type="text"
        pInputText
        formControlName="name"
        [ngClass]="{
          'ng-invalid ng-dirty':
            accountForm.get('name')?.invalid && accountForm.get('name')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="
          accountForm.get('name')?.invalid && accountForm.get('name')?.touched
        "
      >
        姓名為必填欄位，且至少需要 2 個字元
      </small>
    </div>
    <div class="field">
      <label for="account">帳號</label>
      <input
        id="account"
        type="text"
        pInputText
        formControlName="account"
        [ngClass]="{
          'ng-invalid ng-dirty':
            accountForm.get('account')?.invalid &&
            accountForm.get('account')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="
          accountForm.get('account')?.invalid &&
          accountForm.get('account')?.touched
        "
      >
        帳號為必填欄位，且至少需要 3 個字元
      </small>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="text"
        pInputText
        formControlName="email"
        [ngClass]="{
          'ng-invalid ng-dirty':
            accountForm.get('email')?.invalid &&
            accountForm.get('email')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="
          accountForm.get('email')?.invalid && accountForm.get('email')?.touched
        "
      >
        請輸入有效的 Email 地址
      </small>
    </div>

    <div
      class="field flex justify-content-start align-items-center"
      *ngIf="isEditMode"
    >
      <label class="mr-4" for="isActive">帳戶狀態</label>
      <p-inputSwitch formControlName="isActive"></p-inputSwitch>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <button
        pButton
        type="button"
        label="取消"
        class="p-button-secondary"
        routerLink="/accounts"
      ></button>
      <button
        pButton
        type="submit"
        label="儲存"
        [loading]="loading"
        [disabled]="accountForm.invalid"
      ></button>
    </div>
  </form>
</div>
