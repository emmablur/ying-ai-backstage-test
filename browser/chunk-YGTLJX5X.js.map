<div class="card">
  <p-confirmDialog />
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>商品管理</h2>
    <button
      pButton
      label="新增商品"
      icon="pi pi-plus"
      class="p-button-success"
      routerLink="new"
    ></button>
  </div>

  <p-table
    [value]="products"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="p-datatable-gridlines"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>圖片</th>
        <th>商品名稱</th>
        <th>分類</th>
        <th>價格</th>
        <th>庫存</th>
        <th>上架狀態</th>
        <th>操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td>
          <img
            [src]="product.imageUrl || 'assets/img/no-img.png'"
            [alt]="product.name"
            class="w-4rem shadow-2 rounded"
            style="max-width: 100px"
          />
        </td>
        <td>{{ product.name }}</td>
        <td>{{ categoryFormatter(product.categories) }}</td>
        <td>{{ product.price | number : "1.0-0" }}</td>
        <td>{{ product.stock }}</td>
        <td>
          @if(product.isPublished){
          <p-tag severity="success" value="上架中"></p-tag>
          }@else{
          <p-tag severity="secondary" value="未上架"></p-tag>
          }
        </td>
        <td>
          <div class="flex gap-2">
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-rounded p-button-success"
              [routerLink]="['edit', product._id]"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger"
              (click)="confirmDelete(product)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center p-4">尚無商品.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
