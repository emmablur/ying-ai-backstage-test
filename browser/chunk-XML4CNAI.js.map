<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>付款資訊管理</h2>
    <p-button
      [label]="loading ? '儲存中...' : '儲存'"
      icon="pi pi-save"
      [disabled]="loading"
      [loading]="loading"
      (onClick)="savePaymentInfo()"
    >
    </p-button>
  </div>

  <div *ngIf="lastUpdated" class="text-sm text-500 text-right">
    上次更新時間: {{ lastUpdated }}
  </div>

  <form [formGroup]="paymentInfoForm">
    <div class="field">
      <p-editor formControlName="content" [style]="{ height: '320px' }">
        <ng-template pTemplate="header">
          <span class="ql-formats">
            <button type="button" class="ql-bold" aria-label="Bold"></button>
            <button
              type="button"
              class="ql-italic"
              aria-label="Italic"
            ></button>
            <button
              type="button"
              class="ql-underline"
              aria-label="Underline"
            ></button>
          </span>
          <span class="ql-formats">
            <select class="ql-color"></select>
            <select class="ql-background"></select>
          </span>
          <span class="ql-formats">
            <button
              type="button"
              class="ql-list"
              value="ordered"
              aria-label="Ordered List"
            ></button>
            <button
              type="button"
              class="ql-list"
              value="bullet"
              aria-label="Unordered List"
            ></button>
            <select class="ql-align">
              <option selected></option>
              <option value="center"></option>
              <option value="right"></option>
              <option value="justify"></option>
            </select>
          </span>
          <span class="ql-formats">
            <button
              type="button"
              class="ql-link"
              aria-label="Insert Link"
            ></button>
          </span>
          <span class="ql-formats">
            <button
              type="button"
              class="ql-clean"
              aria-label="Remove Styles"
            ></button>
          </span>
        </ng-template>
      </p-editor>
    </div>
  </form>
</div>
