<div class="card">
  <p-confirmDialog />
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>內容管理</h2>
    <button
      pButton
      label="新增內容"
      icon="pi pi-plus"
      class="p-button-success"
      routerLink="new"
    ></button>
  </div>

  <p-table
    [value]="contents"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    styleClass="p-datatable-gridlines"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>標題</th>
        <th>內容類型</th>
        <th>建立時間</th>
        <th>狀態</th>
        <th>操作</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-content>
      <tr>
        <td>{{ content.title }}</td>
        <td>{{ content.contentType | appContentType }}</td>
        <td>{{ content.createdAt | date : "yyyy-MM-dd HH:mm" }}</td>
        <td>
          @if( content.isPublic){
          <p-tag severity="success" value="已發布"></p-tag>
          }@else{
          <p-tag severity="warning" value="未發布"></p-tag>
          }
        </td>
        <td>
          <div class="flex gap-2">
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-rounded p-button-success"
              [routerLink]="['edit', content._id]"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger"
              (click)="confirmDelete(content)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center p-4">尚無內容.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
