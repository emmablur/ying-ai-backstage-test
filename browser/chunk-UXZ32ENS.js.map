<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>{{ isEditMode ? "編輯" : "新增" }}內容</h2>
  </div>

  <form [formGroup]="contentForm" (ngSubmit)="onSubmit()" class="p-fluid">
    <div class="field">
      <label for="title">標題</label>
      <input
        id="title"
        type="text"
        pInputText
        formControlName="title"
        [ngClass]="{
          'ng-invalid ng-dirty':
            contentForm.get('title')?.invalid &&
            contentForm.get('title')?.touched
        }"
      />
      <small
        class="p-error"
        *ngIf="
          contentForm.get('title')?.invalid && contentForm.get('title')?.touched
        "
      >
        標題必須填寫且至少3個字
      </small>
    </div>

    <div class="field">
      <label for="contentType">內容類型</label>
      <p-dropdown
        formControlName="contentType"
        [options]="contentTypeOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="選擇內容類型"
      ></p-dropdown>
    </div>

    <div class="field">
      <label for="content">內容</label>
      <p-editor formControlName="content" [style]="{ height: '500px' }">
        <ng-template pTemplate="header">
          <span class="ql-formats">
            <select class="ql-header">
              <option value="1">標題 1</option>
              <option value="2">標題 2</option>
              <option value="3">標題 3</option>
              <option value="4">標題 4</option>
              <option value="5">標題 5</option>
              <option value="6">標題 6</option>
              <option selected>正文</option>
            </select>
          </span>
          <span class="ql-formats">
            <button type="button" class="ql-bold" aria-label="Bold"></button>
            <button
              type="button"
              class="ql-italic"
              aria-label="Italic"
            ></button>
            <button
              type="button"
              class="ql-underline"
              aria-label="Underline"
            ></button>
            <button
              type="button"
              class="ql-strike"
              aria-label="Strike"
            ></button>
          </span>
          <span class="ql-formats">
            <select class="ql-color"></select>
            <select class="ql-background"></select>
          </span>
          <span class="ql-formats">
            <button type="button" class="ql-script" value="sub"></button>
            <button type="button" class="ql-script" value="super"></button>
          </span>
          <span class="ql-formats">
            <button type="button" class="ql-list" value="ordered"></button>
            <button type="button" class="ql-list" value="bullet"></button>
            <button type="button" class="ql-indent" value="-1"></button>
            <button type="button" class="ql-indent" value="+1"></button>
          </span>
          <span class="ql-formats">
            <button type="button" class="ql-direction" value="rtl"></button>
            <select class="ql-align"></select>
          </span>
          <span class="ql-formats">
            <button type="button" class="ql-link"></button>
            <button type="button" class="ql-image"></button>
            <button type="button" class="ql-code-block"></button>
          </span>
          <span class="ql-formats">
            <button type="button" class="ql-clean"></button>
          </span>
        </ng-template>
      </p-editor>
      <small
        class="p-error"
        *ngIf="
          contentForm.get('content')?.invalid &&
          contentForm.get('content')?.touched
        "
      >
        請填寫內容
      </small>
    </div>

    <div class="flex gap-4 mb-4">
      <div class="field">
        <label class="block mb-2">公開狀態</label>
        <p-inputSwitch
          formControlName="isPublic"
          [trueValue]="true"
          [falseValue]="false"
        ></p-inputSwitch>
        <small class="block mt-1 text-gray-600">開啟表示對外公開</small>
      </div>
    </div>

    <div class="flex justify-content-end mt-4">
      <p-button
        label="取消"
        icon="pi pi-times"
        styleClass="p-button-text mr-2"
        routerLink="/contents"
      ></p-button>
      <p-button
        [label]="loading ? '儲存中...' : '儲存'"
        icon="pi pi-save"
        type="submit"
        [disabled]="loading"
        [loading]="loading"
      ></p-button>
    </div>
  </form>
</div>
