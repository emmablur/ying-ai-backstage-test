<div class="grid">
  <div class="col-12">
    <div class="card">
      <div class="flex justify-content-between align-items-center mb-4">
        <h2>選單管理</h2>
        <button
          type="button"
          pButton
          pRipple
          label="新增選單"
          icon="pi pi-plus"
          class="p-button-primary"
          routerLink="/menus/new"
        ></button>
      </div>
      <p>拖曳調整選單順序和階層（最多三層）</p>

      <div class="flex justify-content-between align-items-center mb-3"></div>

      <p-card>
        <div
          *ngIf="loading"
          class="flex justify-content-center align-items-center"
          style="height: 200px"
        >
          <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
        </div>

        <div *ngIf="!loading && menuTree.length === 0" class="text-center py-5">
          <p class="text-muted">尚無選單項目</p>
        </div>

        <p-tree
          *ngIf="!loading && menuTree.length > 0"
          [value]="menuTree"
          [draggableNodes]="true"
          [droppableNodes]="true"
          (onNodeDrop)="onNodeDrop($event)"
          styleClass="w-full"
        >
          <ng-template let-node pTemplate="default">
            <div
              class="flex flex-wrap align-items-center justify-content-between gap-2 p-3 w-full"
            >
              <div class="flex align-items-center gap-2">
                <i
                  [ngClass]="node.data.icon || 'pi pi-circle'"
                  class="text-primary"
                ></i>
                <div>
                  <div class="font-bold">{{ node.data.name }}</div>
                  <div class="text-sm text-secondary">
                    <p-tag
                      [value]="getMenuTypeLabel(node.data.menuType)"
                      [severity]="getMenuTypeSeverity(node.data.menuType)"
                    ></p-tag>
                    <span class="ml-2" *ngIf="node.data.description">{{
                      node.data.description
                    }}</span>
                    <span
                      class="ml-2"
                      [ngClass]="{
                        'text-orange-500': node.data.level === 2,
                        'text-green-500': node.data.level < 2
                      }"
                    >
                      層級: {{ node.data.level + 1 }}
                    </span>
                    <span class="ml-2">排序: {{ node.data.displayOrder }}</span>
                  </div>
                </div>
              </div>

              <div class="flex align-items-center gap-2">
                <button
                  type="button"
                  pButton
                  pRipple
                  icon="pi pi-pencil"
                  class="p-button-rounded p-button-info"
                  pTooltip="編輯"
                  (click)="editMenu(node.data)"
                ></button>
                <button
                  type="button"
                  pButton
                  pRipple
                  icon="pi pi-trash"
                  class="p-button-rounded p-button-danger"
                  pTooltip="刪除"
                  (click)="confirmDelete(node.data)"
                ></button>
              </div>
            </div>
          </ng-template>
        </p-tree>
      </p-card>
    </div>
  </div>
</div>

<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
