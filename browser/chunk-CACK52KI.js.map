<p-toast></p-toast>

<div class="card">
  <div class="flex justify-content-between align-items-center mb-4">
    <h3>{{ isEditMode ? "編輯選單" : "新增選單" }}</h3>
  </div>

  <div class="card-body">
    <div *ngIf="loading" class="loading-container">
      <p-progressSpinner></p-progressSpinner>
      <p>載入中...</p>
    </div>

    <form *ngIf="!loading" [formGroup]="menuForm" (ngSubmit)="onSubmit()">
      <!-- 基本資訊 -->
      <div class="form-section">
        <h4>基本資訊</h4>
        <p-divider></p-divider>

        <div class="form-grid">
          <div class="form-group">
            <label for="name">選單名稱 <span class="required">*</span></label>
            <input
              pInputText
              id="name"
              formControlName="name"
              placeholder="請輸入選單名稱"
              [class.ng-invalid]="isFieldInvalid('name')"
            />
            <small *ngIf="isFieldInvalid('name')" class="p-error">
              {{ getFieldError("name") }}
            </small>
          </div>

          <div class="form-group">
            <label for="slug">URL 識別符</label>
            <input
              pInputText
              id="slug"
              formControlName="slug"
              placeholder="留空自動生成"
              [class.ng-invalid]="isFieldInvalid('slug')"
            />
            <small class="form-help">
              用於URL的友善識別符，留空將自動根據選單名稱生成
            </small>
          </div>

          <div class="form-group">
            <label for="menuType"
              >選單類型 <span class="required">*</span></label
            >
            <p-dropdown
              [options]="menuTypes"
              formControlName="menuType"
              placeholder="選擇選單類型"
              optionLabel="label"
              optionValue="value"
              [showClear]="false"
            ></p-dropdown>
          </div>

          <!-- <div class="form-group">
              <label for="displayOrder">顯示順序</label>
              <p-inputNumber
                formControlName="displayOrder"
                [min]="1"
                [max]="999"
                [showButtons]="true"
                placeholder="1"
              ></p-inputNumber>
            </div> -->

          <!-- <div class="form-group">
              <label for="level">選單層級</label>
              <p-inputNumber
                formControlName="level"
                [min]="1"
                [max]="3"
                [showButtons]="true"
                placeholder="1"
              ></p-inputNumber>
              <small class="form-help">選單的層級深度 (1-3)</small>
            </div> -->

          <!-- <div class="form-group">
              <label for="requiredRole">所需權限</label>
              <p-dropdown
                [options]="requiredRoles"
                formControlName="requiredRole"
                placeholder="選擇所需權限"
                optionLabel="label"
                optionValue="value"
              ></p-dropdown>
            </div>

            <div class="form-group">
              <label for="icon">圖示</label>
              <input
                pInputText
                id="icon"
                formControlName="icon"
                placeholder="例如: pi pi-home"
              />
              <small class="form-help"> 使用 PrimeIcons 圖示類別名稱 </small>
            </div> -->

          <div class="form-group full-width">
            <label for="description">描述</label>
            <textarea
              pInputTextarea
              id="description"
              formControlName="description"
              rows="3"
              placeholder="選單描述"
              [class.ng-invalid]="isFieldInvalid('description')"
            ></textarea>
            <small *ngIf="isFieldInvalid('description')" class="p-error">
              {{ getFieldError("description") }}
            </small>
          </div>

          <div class="form-group">
            <div class="switch-group">
              <label for="isActive">啟用狀態</label>
              <p-inputSwitch formControlName="isActive"></p-inputSwitch>
            </div>
          </div>
        </div>
      </div>

      <!-- 單頁配置 -->
      <div *ngIf="isSingle" class="form-section" formGroupName="singleConfig">
        <h4>單頁配置</h4>
        <p-divider></p-divider>

        <div class="form-grid">
          <div class="form-group">
            <label for="contentId">顯示頁面</label>
            <p-dropdown
              [options]="singlePageOptions"
              formControlName="contentId"
              placeholder="選擇單頁內容"
              optionLabel="label"
              optionValue="value"
            ></p-dropdown>

            <small class="form-help"> 將在該選單顯示的內容頁面 </small>
          </div>

          <div class="form-group">
            <div class="switch-group">
              <label for="openInNewTab">在新視窗開啟</label>
              <p-inputSwitch formControlName="openInNewTab"></p-inputSwitch>
            </div>
          </div>
        </div>
      </div>

      <!-- 連結配置 -->
      <div *ngIf="isLink" class="form-section" formGroupName="linkConfig">
        <h4>連結配置</h4>
        <p-divider></p-divider>

        <div class="form-grid">
          <div class="form-group">
            <label for="url">連結 URL</label>
            <input
              pInputText
              id="url"
              formControlName="url"
              placeholder="請輸入連結 URL"
              [class.ng-invalid]="isFieldInvalid('url')"
            />
            <small *ngIf="isFieldInvalid('url')" class="p-error">
              {{ getFieldError("url") }}
            </small>
          </div>
          <div class="form-group">
            <div class="switch-group">
              <label for="openInNewTab">在新視窗開啟</label>
              <p-inputSwitch formControlName="openInNewTab"></p-inputSwitch>
            </div>
          </div>
        </div>
      </div>

      <!-- 產品配置 -->
      <div *ngIf="isProduct" class="form-section" formGroupName="productConfig">
        <h4>產品配置</h4>
        <p-divider></p-divider>

        <div class="form-grid">
          <div class="form-group">
            <label for="categoryId">產品分類</label>
            <p-dropdown
              [options]="categoryOptions"
              formControlName="categoryId"
              placeholder="選擇產品類別"
              optionLabel="name"
              optionValue="_id"
              [showClear]="false"
            ></p-dropdown>

            <small class="form-help">
              指定顯示的產品分類ID，留空顯示所有產品
            </small>
          </div>

          <div class="form-group">
            <div class="switch-group">
              <label for="openInNewTab">在新視窗開啟</label>
              <p-inputSwitch formControlName="openInNewTab"></p-inputSwitch>
            </div>
          </div>
        </div>
      </div>

      <!-- 類別配置 -->
      <div
        *ngIf="isCategory"
        class="form-section"
        formGroupName="categoryConfig"
      >
        <h4>類別配置</h4>
        <p-divider></p-divider>

        <div class="form-grid">
          <div class="form-group">
            <label for="contentType">內容類型</label>
            <p-dropdown
              [options]="contentTypes"
              formControlName="contentType"
              placeholder="選擇內容類型"
              optionLabel="label"
              optionValue="value"
            ></p-dropdown>
          </div>

          <div class="form-group">
            <label for="displayStyle">顯示樣式</label>
            <p-dropdown
              [options]="displayStyles"
              formControlName="displayStyle"
              placeholder="選擇顯示樣式"
              optionLabel="label"
              optionValue="value"
            ></p-dropdown>
          </div>

          <div class="form-group">
            <label for="itemsPerPage">每頁顯示數量</label>
            <p-inputNumber
              formControlName="itemsPerPage"
              [min]="1"
              [max]="100"
              [showButtons]="true"
              placeholder="12"
            ></p-inputNumber>
          </div>

          <div class="form-group">
            <label for="sortBy">排序欄位</label>
            <p-dropdown
              [options]="sortByOptions"
              formControlName="sortBy"
              placeholder="選擇排序欄位"
              optionLabel="label"
              optionValue="value"
            ></p-dropdown>
          </div>

          <div class="form-group">
            <label for="sortOrder">排序方向</label>
            <p-dropdown
              [options]="sortOrderOptions"
              formControlName="sortOrder"
              placeholder="選擇排序方向"
              optionLabel="label"
              optionValue="value"
            ></p-dropdown>
          </div>

          <div class="form-group">
            <label for="categoryFilter">類別篩選</label>
            <input
              pInputText
              id="categoryFilter"
              formControlName="categoryFilter"
              placeholder="類別篩選ID"
            />
          </div>

          <div class="form-group">
            <div class="switch-group">
              <label for="enableSearch">啟用搜索</label>
              <p-inputSwitch formControlName="enableSearch"></p-inputSwitch>
            </div>
          </div>

          <div class="form-group">
            <div class="switch-group">
              <label for="enableCategoryFilter">啟用類別篩選</label>
              <p-inputSwitch
                formControlName="enableCategoryFilter"
              ></p-inputSwitch>
            </div>
          </div>
        </div>
      </div>

      <!-- 操作按鈕 -->
      <div class="form-actions">
        <p-button
          type="button"
          label="取消"
          styleClass="p-button-text"
          (onClick)="onCancel()"
          [disabled]="submitting"
        ></p-button>

        <p-button
          type="submit"
          [label]="isEditMode ? '更新' : '建立'"
          [loading]="submitting"
          [disabled]="menuForm.invalid"
        ></p-button>
      </div>
    </form>
  </div>
</div>
