<div
  class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-column align-items-center justify-content-center">
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <div
        class="w-full surface-card py-8 px-5 sm:px-8"
        style="border-radius: 53px"
      >
        <div class="text-center mb-5">
          <div class="text-900 text-3xl font-medium mb-3">重設密碼</div>
          <span class="text-600 font-medium">請設定您的新密碼</span>
        </div>

        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
          <div>
            <label
              for="password"
              class="block text-900 text-xl font-medium mb-2"
              >新密碼</label
            >
            <p-password
              id="password"
              formControlName="password"
              [toggleMask]="true"
              styleClass="mb-2"
              inputStyleClass="w-full p-3 md:w-30rem"
              [ngClass]="{
                'ng-invalid ng-dirty':
                  resetPasswordForm.get('password')?.invalid &&
                  resetPasswordForm.get('password')?.touched
              }"
            >
              <ng-template pTemplate="footer">
                <p-divider></p-divider>
                <p class="mt-2">密碼須符合：</p>
                <ul class="pl-2 ml-2 mt-0 text-xs">
                  <li>至少 8 個字符</li>
                  <li>至少包含一個大寫字母</li>
                  <li>至少包含一個小寫字母</li>
                  <li>至少包含一個數字</li>
                </ul>
              </ng-template>
            </p-password>
            <small
              *ngIf="
                resetPasswordForm.get('password')?.invalid &&
                resetPasswordForm.get('password')?.touched
              "
              class="p-error block mb-3"
            >
              <span
                *ngIf="resetPasswordForm.get('password')?.errors?.['required']"
                >必須輸入密碼</span
              >
              <span
                *ngIf="resetPasswordForm.get('password')?.errors?.['minlength']"
                >密碼長度必須大於 8 個字符</span
              >
              <span
                *ngIf="resetPasswordForm.get('password')?.errors?.['passwordStrength']"
              >
                密碼必須包含大寫字母、小寫字母和數字
              </span>
            </small>

            <label
              for="confirmPassword"
              class="block text-900 text-xl font-medium mb-2"
              >確認密碼</label
            >
            <p-password
              id="confirmPassword"
              formControlName="confirmPassword"
              [toggleMask]="true"
              styleClass="mb-2"
              inputStyleClass="w-full p-3 md:w-30rem"
              [ngClass]="{
                'ng-invalid ng-dirty':
                  resetPasswordForm.get('confirmPassword')?.invalid &&
                  resetPasswordForm.get('confirmPassword')?.touched
              }"
            >
            </p-password>
            <small
              *ngIf="
                resetPasswordForm.get('confirmPassword')?.invalid &&
                resetPasswordForm.get('confirmPassword')?.touched
              "
              class="p-error block mb-3"
            >
              <span
                *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']"
                >必須確認密碼</span
              >
              <span
                *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['passwordMismatch']"
              >
                兩次密碼不一致
              </span>
            </small>

            <div class="flex align-items-center justify-content-center mt-5">
              <button
                pButton
                pRipple
                type="submit"
                label="送出"
                class="w-full p-3 text-xl"
                [loading]="isSubmitting"
                [disabled]="resetPasswordForm.invalid || isSubmitting"
              ></button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<p-toast></p-toast>
