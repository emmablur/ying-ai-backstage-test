<div
  class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-column align-items-center justify-content-center">
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <div
        class="w-full surface-card py-8 px-5 sm:px-8"
        style="border-radius: 53px"
      >
        <div class="text-center mb-5">
          <img
            src="img/Logo_icon(W)_square.png"
            alt="Image"
            height="130"
            class="mb-3 rounded-full"
          />
          <div class="text-900 text-3xl font-medium mb-3">
            英愛手作後台管理系統
          </div>
          <!-- <span class="text-600 font-medium">Sign in to continue</span> -->
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div>
            <label for="email" class="block text-900 text-xl font-medium mb-2"
              >Email</label
            >
            <input
              id="email"
              formControlName="email"
              type="text"
              placeholder="Email address"
              pInputText
              class="w-full md:w-30rem mb-2"
              style="padding: 1rem"
              [ngClass]="{
                'ng-invalid ng-dirty':
                  loginForm.get('email')?.invalid &&
                  loginForm.get('email')?.touched
              }"
            />
            <small
              *ngIf="
                loginForm.get('email')?.invalid &&
                loginForm.get('email')?.touched
              "
              class="p-error block mb-3"
            >
              <span *ngIf="loginForm.get('email')?.errors?.['required']"
                >請輸入 Email</span
              >
              <span *ngIf="loginForm.get('email')?.errors?.['email']"
                >請輸入正確格式</span
              >
            </small>

            <label
              for="password"
              class="block text-900 font-medium text-xl mb-2"
              >密碼</label
            >
            <p-password
              id="password"
              formControlName="password"
              placeholder="Password"
              [toggleMask]="true"
              styleClass="mb-2"
              inputStyleClass="w-full p-3 md:w-30rem"
              [ngClass]="{
                'ng-invalid ng-dirty':
                  loginForm.get('password')?.invalid &&
                  loginForm.get('password')?.touched
              }"
            ></p-password>
            <small
              *ngIf="
                loginForm.get('password')?.invalid &&
                loginForm.get('password')?.touched
              "
              class="p-error block mb-3"
            >
              請輸入密碼
            </small>

            <div
              class="flex align-items-center justify-content-between mb-5 gap-5"
            >
              <div class="flex align-items-center">
                <p-checkbox
                  formControlName="rememberMe"
                  inputId="rememberme1"
                  [binary]="true"
                  styleClass="mr-2"
                ></p-checkbox>
                <label for="rememberme1">記住我</label>
              </div>
              <a
                class="font-medium no-underline ml-2 text-right cursor-pointer"
                style="color: var(--primary-color)"
                (click)="showForgotPasswordDialog()"
                >忘記密碼?</a
              >
            </div>
            <button
              pButton
              pRipple
              type="submit"
              label="登入"
              class="w-full p-3 text-xl"
              [loading]="isLoading"
              [disabled]="isLoading"
            ></button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- 忘記密碼對話框 -->
<p-dialog
  header="忘記密碼"
  [(visible)]="forgotPasswordDialog"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '450px' }"
>
  <div class="p-fluid">
    <div class="field">
      <label for="forgotPasswordEmail"
        >請輸入您的 Email，我們將發送重設密碼連結</label
      >
      <input
        id="forgotPasswordEmail"
        type="email"
        pInputText
        [(ngModel)]="forgotPasswordEmail"
        class="w-full mt-2"
      />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <button
      pButton
      pRipple
      type="button"
      label="取消"
      class="p-button-outlined p-button-secondary"
      (click)="forgotPasswordDialog = false"
      [disabled]="isSendingPasswordReset"
    ></button>
    <button
      pButton
      pRipple
      type="button"
      label="發送重設連結"
      (click)="onSendPasswordReset()"
      [loading]="isSendingPasswordReset"
      [disabled]="isSendingPasswordReset"
    ></button>
  </ng-template>
</p-dialog>

<!-- Toast 元件，用於顯示訊息 -->
<p-toast></p-toast>
