<div class="layout-topbar">
  <a class="layout-topbar-logo" routerLink="">
    <img
      src="img/{{
        layoutService.config().colorScheme === 'light'
          ? 'Logo_text with icon(B)'
          : 'Logo_text with icon(B)'
      }}.png"
      alt="logo"
    />
    <span>英愛手作後台管理系統</span>
  </a>

  <button
    #menubutton
    class="p-link layout-menu-button layout-topbar-button"
    (click)="layoutService.onMenuToggle()"
  >
    <i class="pi pi-bars"></i>
  </button>

  <button
    #topbarmenubutton
    class="p-link layout-topbar-menu-button layout-topbar-button"
    (click)="layoutService.showProfileSidebar()"
  >
    <i class="pi pi-ellipsis-v"></i>
  </button>

  <div
    #topbarmenu
    class="layout-topbar-menu"
    [ngClass]="{
      'layout-topbar-menu-mobile-active':
        layoutService.state.profileSidebarVisible
    }"
  >
    <!-- <button class="p-link layout-topbar-button">
            <i class="pi pi-calendar"></i>
            <span>Calendar</span>
        </button> -->
    <button class="p-link layout-topbar-button" (click)="menu.toggle($event)">
      <i class="pi pi-user"></i>
      <span>Profile</span>
    </button>
    <p-menu #menu [popup]="true" [model]="menuItems"></p-menu>

    <!-- <button class="p-link layout-topbar-button" [routerLink]="'/documentation'">
      <i class="pi pi-cog"></i>
      <span>Settings</span>
    </button> -->
  </div>
</div>
